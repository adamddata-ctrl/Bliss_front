<div class="container mt-5" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  
  <!-- Navigation Header Row -->
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
    <div>
      <h2 class="text-primary fw-bold m-0">BLISS Cafeteria - Visual Analytics</h2>
      <p class="text-muted m-0">Isolated metrics overview and category distribution maps</p>
    </div>
    <a routerLink="/dashboard" class="btn btn-outline-secondary d-flex align-items-center gap-2">
      ← Back to Management Dashboard
    </a>
  </div>

  <!-- Analytics Graphic Layout Block -->
  <div class="card shadow-sm p-4" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;">
    <div class="row align-items-center">
      <!-- Pie Chart Rendering Frame -->
      <div class="col-md-6 d-flex justify-content-center mb-4 mb-md-0">
        <div style="position: relative; width: 100%; max-width: 300px; height: 300px;">
          <canvas id="categoryDistributionChart"></canvas>
        </div>
      </div>
      
      <!-- Tabular Text Breakdown Column -->
      <div class="col-md-6">
        <h5 class="text-secondary text-uppercase fw-bold mb-3" style="font-size: 0.85rem; letter-spacing: 0.5px;">Item Quantities By Category</h5>
        <div class="table-responsive">
          <table class="table table-sm table-hover align-middle">
            <thead>
                 <tr class="table-light text-secondary" style="font-size: 0.85rem;">
                <th>Category Reference</th>
                <th class="text-end">Registered Total</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let metric of categoryMetrics | keyvalue">
                <td>
                  <span class="badge text-capitalize px-3 py-2" style="background-color: #4a5568; font-size: 0.8rem;">{{ metric.key }}</span>
                </td>
                <td class="text-end fw-bold text-dark" style="font-size: 1.05rem;">{{ metric.value }}</td>
              </tr>
            </tbody>
          </table>
        </div>
         </div>
    </div>
  </div>
</div>
