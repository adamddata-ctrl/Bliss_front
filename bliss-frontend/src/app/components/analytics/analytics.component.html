<div class="container-fluid py-4">
  <!-- Dynamic dashboard panel container -->
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">
    <div class="card-header bg-white py-3 border-0 text-center">
      <h4 class="card-title fw-bold text-dark m-0">Inventory Category Breakdown</h4>
    </div>
    <div class="card-body d-flex flex-column align-items-center justify-content-center bg-white p-4">
      
      <!-- Safe chart wrapper template binding structure -->
      <div style="position: relative; width: 100%; max-width: 400px; height: 350px;">
        <canvas baseChart 
                [type]="pieChartType"
                [datasets]="pieChartDatasets"
                [labels]="pieChartLabels"
                [options]="pieChartOptions">
        </canvas>
      </div>
       </div>
  </div>
</div>
